name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 1. 백엔드 테스트 및 검증 (CI)
  test-backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Backend Tests
        run: go test -v ./...

      - name: Build Backend
        run: go build -v ./cmd/server

  # 2. 프론트엔드 린트, 테스트 및 빌드 검증 (CI)
  test-frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build Frontend
        run: pnpm build

  # 3. Docker 이미지 빌드 및 GHCR 푸시 (main 브랜치 푸시 및 CI 통과 시에만 실행)
  build-and-push:
    name: Build & Push Images to GHCR
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Downcase repository owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-frontend:${{ github.sha }}

  # 4. 서버 배포 및 헬스체크 검증 (이미지 푸시 완료 후 실행)
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to server and update containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            PORT=$(grep -E '^FRONTEND_PORT=' .env | cut -d '=' -f2 | tr -d ' "\r')
            PORT=${PORT:-42195}

            echo "Waiting for services to become healthy on port $PORT..."
            SUCCESS=0
            for i in $(seq 1 15); do
              if curl -s -f "http://localhost:$PORT/readyz" > /dev/null; then
                echo "Healthcheck passed! Service is ready."
                SUCCESS=1
                break
              fi
              echo "Attempt $i/15: service not ready yet, retrying in 2s..."
              sleep 2
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "Deployment failed: Healthcheck timed out!"
              echo "=== Recent Backend Logs ==="
              docker compose logs backend --tail=50
              echo "=== Recent Frontend Logs ==="
              docker compose logs frontend --tail=50
              exit 1
            fi
