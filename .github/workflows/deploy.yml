# FIT Lab CI/CD 통합 파이프라인
# 1. PR 및 main 푸시 시: Go 및 React 테스트/린트/빌드 검증 (CI)
# 2. main 브랜치 푸시 시: 테스트 통과 후 Docker 이미지 빌드 -> GHCR 푸시 -> 서버 배포 -> 헬스체크 검증 (CD)
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원

permissions:
  contents: read
  packages: write # GHCR(GitHub Container Registry) 이미지 푸시 권한

jobs:
  # =========================================================================
  # 1. 백엔드 테스트 및 검증 (CI)
  # =========================================================================
  test-backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Go 환경 설정 (go.mod 버전 기준)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go 단위 및 통합 테스트 실행
        run: go test -v ./...

      - name: Go 서버 바이너리 빌드 검증
        run: go build -v ./cmd/server

  # =========================================================================
  # 2. 프론트엔드 린트, 테스트 및 빌드 검증 (CI)
  # =========================================================================
  test-frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 패키지 매니저 설치
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Node.js 환경 설정 (최신 LTS v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 프론트엔드 의존성 패키지 설치
        run: pnpm install --frozen-lockfile

      - name: ESLint 코드 스타일 및 문법 검사
        run: pnpm lint

      - name: Vitest 단위 테스트 실행
        run: pnpm test

      - name: 프론트엔드 프로덕션 정적 파일 빌드 검증
        run: pnpm build

  # =========================================================================
  # 3. Docker 이미지 빌드 및 GHCR 푸시 (CD)
  #    - 조건: main 브랜치 푸시이고 앞선 백엔드/프론트엔드 테스트가 모두 성공한 경우만 실행
  # =========================================================================
  build-and-push:
    name: Build & Push Images to GHCR
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # Docker 이미지 태그 규칙상 영문 소문자만 허용되므로 소문자로 변환
      - name: GitHub 계정명 소문자 변환
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 빌더 설정
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry(GHCR) 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지 빌드 및 GHCR 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-backend:${{ github.sha }}

      - name: 프론트엔드 이미지 빌드 및 GHCR 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-frontend:${{ github.sha }}

  # =========================================================================
  # 4. 서버 SSH 접속 배포 및 헬스체크 검증 (CD)
  #    - 조건: 이미지 빌드 및 GHCR 푸시가 성공적으로 완료된 후 실행
  # =========================================================================
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 서버 SSH 접속 및 무중단 배포 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. 서버의 fit-lab 디렉터리로 이동 (Secret 값이 비어있을 경우 ~/apps/fit-lab 기본값 사용)
            TARGET_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
            TARGET_PATH="${TARGET_PATH:-$HOME/apps/fit-lab}"
            cd "$TARGET_PATH"

            # 2. 최신 Docker 이미지 다운로드 및 무중단 컨테이너 재구동
            echo "Pulling latest images from GHCR..."
            docker compose pull
            docker compose up -d --remove-orphans

            # 3. 미사용 이전 Docker 이미지 정리 (디스크 공간 확보)
            docker image prune -f

            # 4. .env 파일에서 웹 포트 읽기 (기본값: 42195)
            PORT=$(grep -E '^FRONTEND_PORT=' .env 2>/dev/null | cut -d '=' -f2 | tr -d ' "\r')
            PORT=${PORT:-42195}

            # 5. 배포 후 정상 구동 확인 (헬스체크: 최대 30초 대기)
            echo "Waiting for services to become healthy on port $PORT..."
            SUCCESS=0
            for i in $(seq 1 15); do
              if curl -s -f "http://localhost:$PORT/readyz" > /dev/null; then
                echo "Healthcheck passed! Service is ready."
                SUCCESS=1
                break
              fi
              echo "Attempt $i/15: service not ready yet, retrying in 2s..."
              sleep 2
            done

            # 6. 헬스체크 실패 시 최근 컨테이너 로그 출력 후 배포 실패 처리
            if [ $SUCCESS -ne 1 ]; then
              echo "Deployment failed: Healthcheck timed out!"
              echo "=== Recent Backend Logs ==="
              docker compose logs backend --tail=50
              echo "=== Recent Frontend Logs ==="
              docker compose logs frontend --tail=50
              exit 1
            fi
