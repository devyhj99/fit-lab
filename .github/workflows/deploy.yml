# FIT Lab CI/CD 통합 파이프라인
# 1. PR 및 main 푸시 시: Go 및 React 테스트/린트/빌드 검증 (CI)
# 2. main 브랜치 푸시 시: 테스트 통과 후 Docker 이미지 병렬 빌드(GHA 캐시 적용) -> GHCR 푸시 -> 서버 배포 -> 헬스체크 검증 (CD)
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원

permissions:
  contents: read
  packages: write # GHCR(GitHub Container Registry) 이미지 푸시 권한

jobs:
  # =========================================================================
  # 1. 백엔드 테스트 및 검증 (CI)
  # =========================================================================
  test-backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Go 환경 설정 (go.mod 버전 기준)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go 단위 및 통합 테스트 실행
        run: go test -v ./...

      - name: Go 서버 바이너리 빌드 검증
        run: go build -v ./cmd/server

  # =========================================================================
  # 2. 프론트엔드 린트, 테스트 및 빌드 검증 (CI)
  # =========================================================================
  test-frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 패키지 매니저 설치
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Node.js 환경 설정 (최신 LTS v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 프론트엔드 의존성 패키지 설치
        run: pnpm install --frozen-lockfile

      - name: ESLint 코드 스타일 및 문법 검사
        run: pnpm lint

      - name: Vitest 단위 테스트 및 커버리지 리포트 생성
        run: |
          pnpm test:coverage --reporter=default --reporter=github-actions 2>&1 | tee test-output.txt

          echo "### 🧪 프론트엔드 테스트 및 커버리지 요약" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g' test-output.txt | grep -E "Test Files.*passed|Tests.*passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          sed -E 's/\x1B\[[0-9;]*[a-zA-Z]//g' test-output.txt | grep -A 25 "% Coverage report from v8" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rm -f test-output.txt

      - name: 프론트엔드 프로덕션 정적 파일 빌드 검증
        run: pnpm build

  # =========================================================================
  # 3-1. 백엔드 Docker 이미지 빌드 & GHCR 푸시 (병렬 실행 + Docker 레이어 캐시)
  # =========================================================================
  build-backend:
    name: Build & Push Backend Image
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: GitHub 계정명 소문자 변환
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: QEMU 설정 (ARM64 아키텍처 지원)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 빌더 설정
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry(GHCR) 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지 빌드 및 GHCR 푸시 (GHA 캐시 적용)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # =========================================================================
  # 3-2. 프론트엔드 Docker 이미지 빌드 & GHCR 푸시 (병렬 실행 + Docker 레이어 캐시)
  # =========================================================================
  build-frontend:
    name: Build & Push Frontend Image
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: GitHub 계정명 소문자 변환
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: QEMU 설정 (ARM64 아키텍처 지원)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 빌더 설정
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry(GHCR) 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 프론트엔드 이미지 빌드 및 GHCR 푸시 (GHA 캐시 적용)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fit-lab-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # =========================================================================
  # 4. 서버 SSH 접속 배포 및 헬스체크 검증 (CD)
  #    - 조건: 백엔드/프론트엔드 두 이미지 빌드가 모두 완료된 후 실행
  # =========================================================================
  deploy:
    name: Deploy to Server
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: 서버 SSH 접속 및 무중단 배포 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. 서버의 fit-lab 디렉터리로 이동 (Secret 값이 비어있을 경우 ~/apps/fit-lab 기본값 사용)
            TARGET_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
            TARGET_PATH="${TARGET_PATH:-$HOME/apps/fit-lab}"
            cd "$TARGET_PATH"

            # 2. 최신 Docker 이미지 다운로드 및 무중단 컨테이너 재구동
            echo "GHCR에서 최신 Docker 이미지를 다운로드합니다..."
            docker compose pull
            docker compose up -d --remove-orphans

            # 3. 미사용 이전 Docker 이미지 정리 (디스크 공간 확보)
            docker image prune -f

            # 4. .env 파일에서 웹 포트 읽기 (기본값: 42195)
            PORT=$(grep -E '^FRONTEND_PORT=' .env 2>/dev/null | cut -d '=' -f2 | tr -d ' "\r')
            PORT=${PORT:-42195}

            # 5. 배포 후 정상 구동 확인 (헬스체크: 최대 30초 대기)
            echo "포트 $PORT 에서 서비스 정상 구동(헬스체크) 응답을 대기 중입니다..."
            SUCCESS=0
            for i in $(seq 1 15); do
              if curl -s -f "http://127.0.0.1:$PORT/readyz" > /dev/null; then
                echo "헬스체크 통과! 서비스가 성공적으로 구동되었습니다."
                SUCCESS=1
                break
              fi
              echo "시도 $i/15: 아직 서비스가 준비되지 않았습니다. 2초 후 재시도..."
              sleep 2
            done

            # 6. 헬스체크 실패 시 최근 컨테이너 로그 출력 후 배포 실패 처리
            if [ $SUCCESS -ne 1 ]; then
              echo "배포 실패: 헬스체크 제한 시간을 초과했습니다!"
              echo "=== 최근 백엔드 컨테이너 로그 ==="
              docker compose logs backend --tail=50
              echo "=== 최근 프론트엔드 컨테이너 로그 ==="
              docker compose logs frontend --tail=50
              exit 1
            fi
