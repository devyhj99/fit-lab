services:
  backend:
    image: ghcr.io/devyhj99/fit-lab-backend:latest
    container_name: fit-lab-backend
    restart: always
    env_file:
      - .env
    networks:
      - global-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    image: ghcr.io/devyhj99/fit-lab-frontend:latest
    container_name: fit-lab-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-42195}:${FRONTEND_PORT:-42195}"
    env_file:
      - .env
    networks:
      - global-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:42195/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  global-net:
    external: true
